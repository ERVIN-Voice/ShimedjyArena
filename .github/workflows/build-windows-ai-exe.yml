name: Build Windows AI + Voice EXE (g4f)

on:
  push:
    branches: ["**"]
    paths:
      - "windows_ai/**"
      - "build_exe_ai/**"
      - "requirements-ai.txt"
      - "tests/test_windows_ai.py"
      - ".github/workflows/build-windows-ai-exe.yml"
  pull_request:
    paths:
      - "windows_ai/**"
      - "build_exe_ai/**"
      - "requirements-ai.txt"
      - "tests/test_windows_ai.py"
      - ".github/workflows/build-windows-ai-exe.yml"
  workflow_dispatch:

jobs:
  build-windows-ai-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install AI + Voice dependencies and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ai.txt pyinstaller

      - name: Run Python test suite (including AI & Voice tests) on Windows
        shell: pwsh
        run: |
          pytest -v *>&1 | Tee-Object -FilePath pytest_win_ai.log
          if ($LASTEXITCODE -ne 0) {
            $err = (Get-Content pytest_win_ai.log -Tail 30) -join " | "
            if ($err.Length -gt 1200) { $err = $err.Substring($err.Length - 1200) }
            Write-Output "::error title=Windows AI Pytest Failure::$err"
            exit 1
          }

      - name: Download offline MediaPipe HandLandmarker model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets\models" | Out-Null
          $model = "assets\models\hand_landmarker.task"
          $urls = @(
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $model -UseBasicParsing
              if ((Get-Item $model).Length -gt 1000000) {
                $downloaded = $true
                break
              }
            } catch {
              Write-Warning "Failed to download from $url : $_"
            }
          }
          if (-not $downloaded) {
            Write-Output "::error title=Model Download Error::Could not download hand_landmarker.task"
            exit 1
          }

      - name: Generate Windows pixel-art icon for AI edition
        shell: pwsh
        run: python build_exe\generate_icon.py build_exe_ai\gcs_shimeji_ai.ico

      - name: Build standalone GCS-Shimeji-AI-Voice-Windows.exe with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm build_exe_ai\gcs_shimeji_ai.spec *>&1 | Tee-Object -FilePath pyinstaller_ai_build.log
          if ($LASTEXITCODE -ne 0) {
            $err = (Get-Content pyinstaller_ai_build.log -Tail 30) -join " | "
            if ($err.Length -gt 1200) { $err = $err.Substring($err.Length - 1200) }
            Write-Output "::error title=PyInstaller AI Build Failure::$err"
            exit 1
          }
          $exe = Get-Item "dist\GCS-Shimeji-AI-Voice-Windows.exe"
          Write-Host ("Built {0} ({1:N1} MB)" -f $exe.FullName, ($exe.Length / 1MB))

      - name: Smoke-test frozen GCS-Shimeji-AI-Voice-Windows.exe (--self-test)
        shell: pwsh
        run: |
          $logFile = Join-Path $PWD "self_test_ai_output.txt"
          if (Test-Path $logFile) { Remove-Item $logFile -Force }
          $proc = Start-Process -FilePath "dist\GCS-Shimeji-AI-Voice-Windows.exe" `
            -ArgumentList "--self-test", "--self-test-log", $logFile `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or -not (Test-Path $logFile)) {
            $errLog = Join-Path $env:APPDATA "GCS-Shimeji\gcs_shimeji_ai_error.log"
            $details = "ExitCode=$($proc.ExitCode)"
            if (Test-Path $errLog) {
              $details += " | " + ((Get-Content $errLog -Tail 25) -join " ")
            }
            if ($details.Length -gt 1200) { $details = $details.Substring(0, 1200) }
            Write-Output "::error title=AI EXE Self-Test Failed::$details"
            exit 1
          }
          Get-Content $logFile

      - name: Upload GCS-Shimeji-AI-Voice-Windows.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCS-Shimeji-AI-Voice-Windows-EXE
          path: dist/GCS-Shimeji-AI-Voice-Windows.exe
          if-no-files-found: error

      - name: Publish direct-download AI EXE to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $exe = "dist\GCS-Shimeji-AI-Voice-Windows.exe"
          $tag = "windows-ai-exe-latest"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe `
              --target "$env:GITHUB_SHA" `
              --prerelease `
              --title "GCS Shimeji AI + Voice (g4f + ГС) — Windows Standalone (.exe)" `
              --notes "Отдельная PC-версия Чубрика с подключённой нейросетью g4f, голосовым управлением (ГС: Push-to-Talk и непрерывный режим с опцией слова активации «Чубрик»), озвучкой ответов (TTS), облачком речи над головой, 8 цветами эмоций, встроенным Hub и MediaPipe 21-pt."
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=AI Release Upload Failed::gh release command exited with $LASTEXITCODE"
            exit 1
          }
